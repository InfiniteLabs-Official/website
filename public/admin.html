<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Just a Studio</title><meta name="description" content=""><meta property="og:title" content="Admin — Just a Studio"><meta property="og:description" content=""><meta property="og:url" content="https://justastudio.netlify.app/admin"><meta property="og:image" content="https://justastudio.netlify.app/assets/logo.png"><meta name="twitter:card" content="summary"><meta name="twitter:site" content="@JustADev_rblx"><link rel="canonical" href="https://justastudio.netlify.app/admin"><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"><link rel="stylesheet" href="/style.css"><meta name="robots" content="noindex"></head><body data-p="admin" data-cta=""><main>

<section style="padding:64px 0"><div class="w" style="max-width:640px"><div id="lg"><h1>Admin</h1><form onsubmit="return false" style="margin-top:24px"><input id="pw" type="password" placeholder="Password"><button class="btn" id="login" style="justify-self:start">Log in</button></form></div>
<div id="ad" hidden><h1>Upload</h1><form id="up" style="margin-top:24px"><input id="ti" placeholder="Title" required><select id="ca"><option>Scripting</option><option>UI</option><option>Animation</option></select><textarea id="de" rows="3" placeholder="Description"></textarea><input id="fi" type="file" accept="image/*,video/*"><input id="ur" placeholder="or video/image/YouTube URL"><button class="btn" style="justify-self:start">Upload</button></form><ul id="list" style="margin-top:32px"></ul></div><p id="msg" style="margin-top:16px"></p></div></section>
</main><script src="/app.js"></script><script>
const hd=()=>({"content-type":"application/json","x-admin":sessionStorage.pw||""}),api=(m,b,q="")=>fetch("/api/media"+q,{method:m,headers:hd(),body:b&&JSON.stringify(b)});
const load=async()=>{const d=await(await fetch("/api/media")).json();list.innerHTML=d.map(i=>`<li style="padding:12px 0;border-bottom:1px solid var(--bd)">${esc(i.title)} · ${esc(i.cat)} · ${i.kind} <button data-d="${i.id}">Delete</button></li>`).join("")};
login.onclick=async()=>{sessionStorage.pw=pw.value;const r=await api("POST",{check:1});if(r.ok){lg.hidden=true;ad.hidden=false;load()}else msg.textContent="Wrong password"};
up.onsubmit=async e=>{e.preventDefault();const f=fi.files[0],b={title:ti.value,cat:ca.value,desc:de.value,url:ur.value};
if(f){if(f.size>4e6)return msg.textContent="Max 4MB. Use a YouTube or direct URL for larger videos.";b.mime=f.type;b.kind=f.type.startsWith("video")?"video":"image";b.data=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)})}
else if(ur.value)b.kind=/\.(mp4|webm|mov)$|youtu/.test(ur.value)?"video":"image";else return msg.textContent="Add a file or URL";
const r=await api("POST",b);msg.textContent=r.ok?"Uploaded":"Upload failed";if(r.ok){up.reset();load()}};
list.onclick=async e=>{const i=e.target.dataset.d;if(i&&confirm("Delete this item?")){await api("DELETE",null,"?id="+i);load()}};
</script></body></html>
